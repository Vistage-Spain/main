name: Refresh videos.json

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-videos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Anthropic SDK
        # Only needed when ANTHROPIC_API_KEY is set; harmless otherwise.
        run: pip install --quiet anthropic

      - name: Refresh videos.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_HANDLE: "@ConorNeill"
          # ANTHROPIC_MODEL: claude-haiku-4-5  # default; override here for sonnet/opus
        run: python scripts/refresh-videos.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- videos.json; then
            echo "No changes to videos.json"
          else
            git add videos.json
            git commit -m "chore: refresh videos.json"
            git push
          fi
