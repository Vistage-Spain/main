<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Random Conor Neill video</title>
    <meta
      name="description"
      content="A random video from the YouTube channel of Conor Neill."
    />
    <meta property="og:title" content="Random Conor Neill video" />
    <meta
      property="og:description"
      content="A random video from the YouTube channel of Conor Neill."
    />
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf7;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --accent: #2a6df4;
        --border: #e5e5e0;
        --button-bg: #1a1a1a;
        --button-fg: #fafaf7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111210;
          --fg: #ececec;
          --muted: #9a9a9a;
          --accent: #6ea8ff;
          --border: #2a2a28;
          --button-bg: #ececec;
          --button-fg: #111210;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter,
          Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 17px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
      }
      main {
        max-width: 48rem;
        width: 100%;
      }
      .player {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .player iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      h1 {
        font-size: 1.35rem;
        margin: 1.25rem 0 0.25rem;
        letter-spacing: -0.01em;
        min-height: 1.5em;
      }
      .meta {
        color: var(--muted);
        margin: 0 0 1.5rem;
        font-size: 0.95rem;
      }
      .meta a {
        color: inherit;
      }
      .meta a:hover {
        color: var(--accent);
      }
      button#roll {
        background: var(--button-bg);
        color: var(--button-fg);
        border: 0;
        border-radius: 999px;
        padding: 0.65rem 1.25rem;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        transition: transform 80ms ease, opacity 120ms ease;
      }
      button#roll:hover { transform: translateY(-1px); }
      button#roll:active { transform: translateY(0); }
      button#roll:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      footer {
        margin-top: 2.5rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
      footer a {
        color: inherit;
        border-bottom: 1px solid var(--border);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="player">
        <iframe
          id="player"
          src="about:blank"
          title="Random video player"
          allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
      <h1 id="title">Loading…</h1>
      <p class="meta">
        <span id="date"></span>
        <a id="watch" href="#" target="_blank" rel="noopener" hidden
          >Watch on YouTube</a
        >
      </p>
      <button id="roll" type="button" disabled>🎲 Another random video</button>
      <footer>
        Random pick from
        <a href="https://www.youtube.com/@ConorNeill" target="_blank" rel="noopener"
          >@ConorNeill</a
        >
        · <a href="https://conorneill.com">conorneill.com</a>
      </footer>
    </main>
    <script>
      const els = {
        player: document.getElementById("player"),
        title: document.getElementById("title"),
        date: document.getElementById("date"),
        watch: document.getElementById("watch"),
        roll: document.getElementById("roll"),
      };

      let videos = [];
      let lastId = null;

      function pick() {
        if (!videos.length) return;
        let v;
        if (videos.length === 1) {
          v = videos[0];
        } else {
          do {
            v = videos[Math.floor(Math.random() * videos.length)];
          } while (v.id === lastId);
        }
        lastId = v.id;
        els.player.src =
          "https://www.youtube-nocookie.com/embed/" +
          encodeURIComponent(v.id) +
          "?rel=0";
        els.title.textContent = v.title || "Untitled";
        els.watch.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(v.id);
        els.watch.hidden = false;
        if (v.publishedAt) {
          const d = new Date(v.publishedAt);
          els.date.textContent =
            d.toLocaleDateString(undefined, { year: "numeric", month: "short" }) +
            " · ";
        } else {
          els.date.textContent = "";
        }
      }

      async function load() {
        try {
          const res = await fetch("videos.json", { cache: "no-cache" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          videos = Array.isArray(data.videos) ? data.videos : [];
        } catch (err) {
          videos = [];
          console.error("Could not load videos.json", err);
        }
        if (!videos.length) {
          els.title.textContent =
            "No videos yet — the daily refresh hasn't run.";
          els.date.textContent = "";
          els.roll.disabled = true;
          return;
        }
        els.roll.disabled = false;
        els.roll.addEventListener("click", pick);
        pick();
      }

      load();
    </script>
  </body>
</html>
