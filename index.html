<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Random Conor Neill video</title>
    <meta
      name="description"
      content="A random video from the YouTube channel of Conor Neill."
    />
    <meta property="og:title" content="Random Conor Neill video" />
    <meta
      property="og:description"
      content="A random video from the YouTube channel of Conor Neill."
    />
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf7;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --accent: #2a6df4;
        --border: #e5e5e0;
        --button-bg: #1a1a1a;
        --button-fg: #fafaf7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111210;
          --fg: #ececec;
          --muted: #9a9a9a;
          --accent: #6ea8ff;
          --border: #2a2a28;
          --button-bg: #ececec;
          --button-fg: #111210;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter,
          Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 17px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
      }
      main {
        max-width: 48rem;
        width: 100%;
      }
      .player {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .player iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      h1 {
        font-size: 1.35rem;
        margin: 1.25rem 0 0.25rem;
        letter-spacing: -0.01em;
        min-height: 1.5em;
      }
      .meta {
        color: var(--muted);
        margin: 0 0 1.5rem;
        font-size: 0.95rem;
      }
      .meta a {
        color: inherit;
      }
      .meta a:hover {
        color: var(--accent);
      }
      button#roll {
        background: var(--button-bg);
        color: var(--button-fg);
        border: 0;
        border-radius: 999px;
        padding: 0.65rem 1.25rem;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        transition: transform 80ms ease, opacity 120ms ease;
      }
      button#roll:hover { transform: translateY(-1px); }
      button#roll:active { transform: translateY(0); }
      button#roll:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .share {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 1rem 0 1.5rem;
      }
      .share-label {
        color: var(--muted);
        font-size: 0.9rem;
        margin-right: 0.25rem;
      }
      .share a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid var(--border);
        color: var(--fg);
        text-decoration: none;
        transition: color 120ms ease, border-color 120ms ease,
          background 120ms ease, transform 80ms ease;
      }
      .share a:hover {
        color: var(--accent);
        border-color: var(--accent);
        transform: translateY(-1px);
      }
      .share a[aria-disabled="true"] {
        opacity: 0.4;
        pointer-events: none;
      }
      .share a.copied {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
        transform: scale(1.08);
      }
      .share svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      .share-hint {
        color: var(--muted);
        font-size: 0.85rem;
        margin: -0.75rem 0 1.5rem;
        line-height: 1.45;
      }
      .share-hint strong {
        color: var(--fg);
        font-weight: 500;
      }
      footer {
        margin-top: 2.5rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
      footer a {
        color: inherit;
        border-bottom: 1px solid var(--border);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="player">
        <iframe
          id="player"
          src="about:blank"
          title="Random video player"
          allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
      <h1 id="title">Loading…</h1>
      <p class="meta">
        <span id="date"></span>
        <a id="watch" href="#" target="_blank" rel="noopener" hidden
          >Watch on YouTube</a
        >
      </p>
      <div class="share" aria-label="Share this video">
        <span class="share-label">Share:</span>
        <a
          id="share-x"
          href="#"
          target="_blank"
          rel="noopener"
          aria-label="Share on X"
          title="Share on X"
          aria-disabled="true"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
            />
          </svg>
        </a>
        <a
          id="share-linkedin"
          href="#"
          target="_blank"
          rel="noopener"
          aria-label="Share on LinkedIn"
          title="Share on LinkedIn"
          aria-disabled="true"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.063 2.063 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"
            />
          </svg>
        </a>
        <a
          id="share-facebook"
          href="#"
          target="_blank"
          rel="noopener"
          aria-label="Share on Facebook"
          title="Share on Facebook"
          aria-disabled="true"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z"
            />
          </svg>
        </a>
      </div>
      <p class="share-hint">
        Tailored caption is copied to your clipboard on click —
        <strong>paste it (Cmd&nbsp;+&nbsp;V) into the post composer</strong>.
        LinkedIn and Facebook don't accept pre-filled post text.
      </p>
      <button id="roll" type="button" disabled>🎲 Another random video</button>
      <footer>
        Random pick from
        <a href="https://www.youtube.com/@ConorNeill" target="_blank" rel="noopener"
          >@ConorNeill</a
        >
        · <a href="https://conorneill.com">conorneill.com</a>
      </footer>
    </main>
    <script>
      const els = {
        player: document.getElementById("player"),
        title: document.getElementById("title"),
        date: document.getElementById("date"),
        watch: document.getElementById("watch"),
        roll: document.getElementById("roll"),
        shareX: document.getElementById("share-x"),
        shareLinkedIn: document.getElementById("share-linkedin"),
        shareFacebook: document.getElementById("share-facebook"),
      };

      let videos = [];
      let lastId = null;

      function pick() {
        if (!videos.length) return;
        let v;
        if (videos.length === 1) {
          v = videos[0];
        } else {
          do {
            v = videos[Math.floor(Math.random() * videos.length)];
          } while (v.id === lastId);
        }
        lastId = v.id;
        els.player.src =
          "https://www.youtube-nocookie.com/embed/" +
          encodeURIComponent(v.id) +
          "?rel=0";
        els.title.textContent = v.title || "Untitled";
        const watchUrl =
          "https://www.youtube.com/watch?v=" + encodeURIComponent(v.id);
        els.watch.href = watchUrl;
        els.watch.hidden = false;
        if (v.publishedAt) {
          const d = new Date(v.publishedAt);
          els.date.textContent =
            d.toLocaleDateString(undefined, { year: "numeric", month: "short" }) +
            " · ";
        } else {
          els.date.textContent = "";
        }
        // Build share URLs + per-platform caption text for the current
        // video. Captions are platform-tuned strings generated by Claude
        // (videos.json -> v.share); fall back to the raw video title.
        //
        // X (Twitter) is the only one of the three that actually respects
        // a `text=` parameter — for LinkedIn and Facebook the captions are
        // copied to the clipboard on click so the user can paste them
        // into the post composer. See the click handler set up below.
        const u = encodeURIComponent(watchUrl);
        const share = v.share || {};
        const fallback = v.title || "Watch this";
        const captionX = share.x || fallback;
        const captionLinkedIn = share.linkedin || fallback;
        const captionFacebook = share.facebook || fallback;
        els.shareX.href =
          "https://twitter.com/intent/tweet?url=" +
          u +
          "&text=" +
          encodeURIComponent(captionX);
        els.shareLinkedIn.href =
          "https://www.linkedin.com/sharing/share-offsite/?url=" + u;
        els.shareFacebook.href =
          "https://www.facebook.com/sharer/sharer.php?u=" + u;
        // Stash the caption on the element so the click handler can copy
        // it. Done as a data attribute (not a closure) so the same
        // handler keeps working across re-rolls.
        els.shareX.dataset.caption = captionX;
        els.shareLinkedIn.dataset.caption = captionLinkedIn;
        els.shareFacebook.dataset.caption = captionFacebook;
        for (const a of [els.shareX, els.shareLinkedIn, els.shareFacebook]) {
          a.removeAttribute("aria-disabled");
        }
      }

      // Copy the per-platform caption to the clipboard on click, then let
      // the <a>'s default navigation open the platform's share dialog. We
      // do NOT preventDefault — the browser-native link click preserves
      // the user gesture and reliably opens a new tab (window.open after
      // an awaited clipboard write would be blocked by some browsers).
      // `navigator.clipboard.writeText` is async but starts synchronously
      // inside the click handler, which is enough for the user-gesture
      // requirement. Brief visual feedback (.copied class) confirms the
      // copy on the source page in case the user comes back to it.
      function setupShareCopy(anchor) {
        anchor.addEventListener("click", () => {
          const text = anchor.dataset.caption;
          if (!text || !navigator.clipboard) return;
          navigator.clipboard
            .writeText(text)
            .then(() => {
              anchor.classList.add("copied");
              setTimeout(() => anchor.classList.remove("copied"), 1200);
            })
            .catch(() => {
              // Silent — clipboard write can fail on http: contexts, in
              // restrictive iframes, or when permission is denied. The
              // share dialog still opens and the user can compose
              // manually.
            });
        });
      }

      async function load() {
        try {
          const res = await fetch("videos.json", { cache: "no-cache" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          videos = Array.isArray(data.videos) ? data.videos : [];
        } catch (err) {
          videos = [];
          console.error("Could not load videos.json", err);
        }
        if (!videos.length) {
          els.title.textContent =
            "No videos yet — the daily refresh hasn't run.";
          els.date.textContent = "";
          els.roll.disabled = true;
          return;
        }
        els.roll.disabled = false;
        els.roll.addEventListener("click", pick);
        setupShareCopy(els.shareX);
        setupShareCopy(els.shareLinkedIn);
        setupShareCopy(els.shareFacebook);
        pick();
      }

      load();
    </script>
  </body>
</html>
